<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>출고요청 대장 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A2C2F;
    --ink-60:#515256;
    --ink-35:#8a8a92;
    --paper:#f2f4f6;
    --card:#FFFFFF;
    --rule:#e3e3e8;
    --rule-2:#d6d7de;
    --stamp-blue:#1577cc;
    --stamp-green:#12925a;
    --stamp-red:#d6173a;
    --stamp-amber:#b5730a;
    --pencil:#8a8a92;
    --kraft:#1577cc;
    --blue-400:#1da4ff;
    --shadow:0 1px 3px rgba(20,24,30,.06), 0 4px 12px rgba(20,24,30,.08);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Pretendard', -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f3f4f6; --ink-60:#c2c5cc; --ink-35:#a9adb8;
      --paper:#17171c; --card:#202028;
      --rule:#313742; --rule-2:#3c3c46;
      --stamp-blue:#1da4ff; --stamp-green:#46c66a; --stamp-red:#ef6d7f; --stamp-amber:#e7b75c;
      --pencil:#8b95a1; --kraft:#1da4ff;
      --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f3f4f6; --ink-60:#c2c5cc; --ink-35:#a9adb8;
    --paper:#17171c; --card:#202028;
    --rule:#313742; --rule-2:#3c3c46;
    --stamp-blue:#1da4ff; --stamp-green:#46c66a; --stamp-red:#ef6d7f; --stamp-amber:#e7b75c;
    --pencil:#8b95a1; --kraft:#1da4ff;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    padding-bottom:88px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 상단 ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
  }
  .bar{
    display:flex;align-items:baseline;gap:10px;
    padding:14px 16px 10px;
  }
  .title{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
  .proto{
    font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.14em;color:var(--kraft);
    border:1px solid var(--kraft);border-radius:2px;
    padding:2px 5px;
  }
  .clock{
    margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-35);
  }

  /* 일/주/월 탭 */
  .tabs{display:flex;gap:0;padding:0 12px;}
  .tab{
    flex:1;appearance:none;background:none;border:0;
    padding:10px 4px 12px;cursor:pointer;
    font-family:var(--sans);font-size:14px;font-weight:600;
    color:var(--ink-35);
    border-bottom:2px solid transparent;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink-60)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .tab .n{
    font-family:var(--mono);font-size:11px;font-weight:700;
    background:var(--rule);color:var(--ink-60);
    border-radius:9px;padding:1px 6px;min-width:20px;text-align:center;
  }
  .tab[aria-selected="true"] .n{background:var(--ink);color:var(--paper)}
  .tab.has-late[aria-selected="true"] .n,
  .tab.has-late .n{background:var(--stamp-red);color:#fff}

  /* 통합/개인 */
  .subtabs{
    display:flex;gap:6px;padding:10px 16px 12px;
    border-top:1px solid var(--rule);
    background:var(--card);
  }
  .subtab{
    appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;
    border:1px solid var(--rule-2);background:transparent;color:var(--ink-60);
    display:inline-flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .subtab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .subtab .c{font-family:var(--mono);font-size:10px;opacity:.75}

  /* ---------- 리스트 ---------- */
  main{padding:14px 12px 0}
  .daygroup{margin-bottom:20px}
  .daylabel{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.12em;color:var(--ink-35);
    margin:0 4px 8px;
  }
  .daylabel::after{content:"";flex:1;height:1px;background:var(--rule)}

  .row{
    position:relative;
    display:grid;
    grid-template-columns:52px 1fr;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:8px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:border-color .15s, opacity .2s;
  }
  .row.late{border-color:var(--stamp-red);border-width:1.5px}
  .row.done{opacity:.5}
  .row.hold{border-color:var(--stamp-amber);border-width:1.5px;background:#f7fbff}

  /* D-day 스탬프 (시그니처) */
  .dday{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;
    border-right:1px solid var(--rule);
    background:linear-gradient(180deg,#fff, #f2f4f6);
    font-family:var(--mono);
  }
  .dday .num{font-size:17px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .dday .unit{font-size:8px;letter-spacing:.1em;color:var(--ink-35)}
  .row.late .dday{background:var(--stamp-red);border-right-color:var(--stamp-red)}
  .row.late .dday .num,.row.late .dday .unit{color:#fff}
  .row.today .dday .num{color:var(--stamp-red)}
  .row.hold .dday{background:repeating-linear-gradient(135deg,#fbf3df,#fbf3df 5px,#f5e6c2 5px,#f5e6c2 10px);border-right-color:var(--stamp-amber)}
  .row.hold .dday .num{color:var(--stamp-amber)}
  .row.hold .dday .unit{color:var(--stamp-amber);opacity:.8}

  .body{padding:10px 12px 10px 11px;min-width:0}
  .line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
  .sr{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-35);letter-spacing:.03em}
  .team{
    font-size:10.5px;font-weight:700;color:var(--ink-60);
    background:var(--rule);border-radius:3px;padding:1px 5px;
  }
  .who{font-size:11.5px;color:var(--ink-60)}
  .assignee{
    font-size:10px;font-weight:700;color:#fff;background:var(--kraft);
    border-radius:3px;padding:1px 5px;letter-spacing:-.01em;
  }

  .item{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:1px 0 2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.done .item{text-decoration:line-through;text-decoration-thickness:1.5px}
  .opt{font-size:12px;font-weight:500;color:var(--ink-60)}
  .qty{font-family:var(--mono);font-size:12px;font-weight:700}

  /* 재고 표시 (이지어드민 연동) */
  .stockbox{
    display:flex;align-items:center;gap:8px;
    margin:5px 0 2px;padding:5px 8px;
    border:1px solid var(--rule);border-radius:5px;background:#f5f9ff;
  }
  .stockbox.short{background:#fce8ea;border-color:#f3b6bd}
  .stockbox.exact{background:#fbf3df;border-color:#ecd08a}
  .stk{display:flex;align-items:baseline;gap:4px;font-family:var(--mono);flex:none}
  .stk .lab{font-size:9px;letter-spacing:.06em;color:var(--ink-35);font-family:var(--sans);font-weight:600}
  .stk .v{font-size:14px;font-weight:700;line-height:1}
  .stk .req .v{color:var(--ink-60)}
  .stk.avail .v{color:var(--stamp-green)}
  .stockbox.short .stk.avail .v{color:var(--stamp-red)}
  .stockbox.exact .stk.avail .v{color:var(--stamp-amber)}
  .gauge{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;min-width:40px}
  .gauge i{display:block;height:100%;background:var(--stamp-green);border-radius:3px}
  .stockbox.short .gauge i{background:var(--stamp-red)}
  .stockbox.exact .gauge i{background:var(--stamp-amber)}
  .stk.sku{margin-left:auto;font-size:10px;color:var(--ink-35);font-weight:400}
  .shorttag{
    font-family:var(--sans);font-size:10px;font-weight:700;color:#fff;
    background:var(--stamp-red);border-radius:3px;padding:2px 6px;flex:none;
  }
  .exacttag{background:var(--stamp-amber)}
  .qhold{
    flex:none;appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:10.5px;font-weight:700;
    color:var(--stamp-red);background:#fff;
    border:1px solid var(--stamp-red);border-radius:4px;padding:3px 8px;
    transition:.15s;
  }
  .qhold:hover{background:var(--stamp-red);color:#fff}
  .calcbtn{
    flex:none;appearance:none;cursor:pointer;
    width:20px;height:20px;border-radius:50%;padding:0;
    border:1px solid var(--rule-2);background:#fff;color:var(--ink-35);
    font-size:11px;font-weight:700;line-height:1;
    display:grid;place-items:center;transition:.15s;
  }
  .calcbtn:hover{border-color:var(--ink);color:var(--ink)}
  .calcrow{
    margin:0 0 2px;padding:9px 10px;
    background:#f2f4f6;border:1px solid var(--rule);border-top:0;
    border-radius:0 0 5px 5px;
  }
  .calcline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono)}
  .ci{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .ci b{font-size:15px;font-weight:700}
  .ci i{font-style:normal;font-size:9px;color:var(--ink-35);font-family:var(--sans);white-space:nowrap}
  .op{font-size:13px;color:var(--ink-35);font-weight:700}
  .ci.res b{color:var(--stamp-green)}
  .ci.res i{color:var(--stamp-green);font-weight:700}
  .ci.res.r-short b,.ci.res.r-short i{color:var(--stamp-red)}
  .calcsrc{margin-top:6px;font-family:var(--mono);font-size:8.5px;color:var(--ink-35);letter-spacing:.03em}
  .trap{
    font-size:11px;font-weight:600;color:var(--stamp-red);
    background:#fce8ea;border:1px solid #f3b6bd;border-radius:4px;
    padding:5px 8px;margin-bottom:8px;line-height:1.4;
  }

  .line3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
  .meta{font-size:11.5px;color:var(--ink-35);display:flex;align-items:center;gap:4px}
  .meta b{color:var(--ink-60);font-weight:600}
  .note{
    font-size:11.5px;color:var(--ink-60);
    background:#eef4fb;border-left:2px solid var(--kraft);
    padding:3px 7px;border-radius:0 3px 3px 0;margin-top:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 상태 + 액션 */
  .actions{display:flex;align-items:center;gap:6px;margin-top:9px}
  .status{
    appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:11px;font-weight:700;
    padding:4px 9px;border-radius:4px;border:1px solid;
    display:inline-flex;align-items:center;gap:5px;
    transition:.15s;
  }
  .status .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .st-wait{color:var(--pencil);border-color:var(--rule-2);background:#fff}
  .st-prog{color:var(--stamp-blue);border-color:var(--stamp-blue);background:#EEF4FB}
  .st-done{color:var(--stamp-green);border-color:var(--stamp-green);background:#EDF6F1}
  .st-hold{color:var(--stamp-amber);border-color:var(--stamp-amber);background:#fbf3df}

  /* 보류 사유 배너 */
  .holdbar{
    display:flex;align-items:center;gap:6px;
    margin-top:7px;padding:5px 8px;
    background:#fbf3df;border:1px solid #ecd08a;border-radius:4px;
    font-size:11.5px;color:var(--stamp-amber);font-weight:600;
  }
  .holdbar .pz{font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    background:var(--stamp-amber);color:#fff;border-radius:2px;padding:1px 4px;flex:none}
  .holdbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .holdbtn{
    appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:11px;font-weight:700;
    padding:4px 9px;border-radius:4px;
    border:1px dashed var(--rule-2);background:#fff;color:var(--ink-35);
    transition:.15s;
  }
  .holdbtn:hover{border-color:var(--stamp-amber);color:var(--stamp-amber)}
  .holdbtn[aria-pressed="true"]{border-style:solid;border-color:var(--stamp-amber);
    background:var(--stamp-amber);color:#fff}

  .check{
    appearance:none;cursor:pointer;
    width:28px;height:28px;border-radius:5px;
    border:1.5px solid var(--rule-2);background:#fff;
    display:grid;place-items:center;padding:0;
    transition:.15s;
  }
  .check svg{width:15px;height:15px;stroke:var(--rule-2);stroke-width:3;fill:none;
             stroke-linecap:round;stroke-linejoin:round;transition:.15s}
  .check[aria-pressed="true"]{background:var(--stamp-green);border-color:var(--stamp-green)}
  .check[aria-pressed="true"] svg{stroke:#fff}

  .send{
    margin-left:auto;appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:11.5px;font-weight:700;
    padding:6px 12px;border-radius:5px;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    display:inline-flex;align-items:center;gap:5px;
    transition:.15s;
  }
  .send:disabled{background:#fff;color:var(--ink-35);border-color:var(--rule);cursor:not-allowed}
  .send.sent{background:#fff;color:var(--stamp-green);border-color:var(--stamp-green)}
  .send svg{width:12px;height:12px;fill:currentColor}

  /* 빈 상태 */
  .empty{
    text-align:center;padding:56px 20px;color:var(--ink-35);
  }
  .empty .mk{font-family:var(--mono);font-size:28px;color:var(--rule-2);margin-bottom:8px}
  .empty p{margin:0;font-size:13px}

  /* 토스트 */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
    background:var(--ink);color:var(--paper);
    font-size:12.5px;font-weight:600;
    padding:10px 16px;border-radius:6px;
    display:flex;align-items:center;gap:8px;
    opacity:0;pointer-events:none;transition:.22s;
    z-index:60;max-width:88vw;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast .slack{width:13px;height:13px;flex:none}

  /* 하단 요약바 */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--card);border-top:1px solid var(--rule-2);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;
  }
  .stat{display:flex;flex-direction:column;gap:1px}
  .stat .v{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1}
  .stat .k{font-size:9.5px;color:var(--ink-35);letter-spacing:.02em}
  .stat.late .v{color:var(--stamp-red)}
  .stat.done .v{color:var(--stamp-green)}
  .stat.hold .v{color:var(--stamp-amber)}
  .sep{width:1px;height:24px;background:var(--rule)}
  .src{
    margin-left:auto;text-align:right;
    font-family:var(--mono);font-size:8.5px;color:var(--ink-35);line-height:1.35;
  }

  /* 보류 사유 선택 시트 */
  #scrim{
    position:fixed;inset:0;background:rgba(22,24,27,.45);z-index:70;
    opacity:0;pointer-events:none;transition:.2s;
  }
  #scrim.on{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;left:50%;bottom:0;width:100%;max-width:560px;
    transform:translate(-50%,100%);
    background:var(--card);z-index:71;
    border-radius:14px 14px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    transition:transform .24s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -8px 32px -12px rgba(0,0,0,.4);
  }
  #sheet.on{transform:translate(-50%,0)}
  #sheet h2{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.02em}
  #sheet .sub{margin:0 0 14px;font-size:12px;color:var(--ink-35)}
  #sheet .sub b{font-family:var(--mono);color:var(--ink-60)}

  /* 송장 등록 시트 (기존 #scrim/#sheet 패턴 재사용) */
  #trackScrim{position:fixed;inset:0;background:rgba(22,24,27,.45);z-index:80;opacity:0;pointer-events:none;transition:.2s}
  #trackScrim.on{opacity:1;pointer-events:auto}
  #trackSheet{
    position:fixed;left:50%;bottom:0;width:100%;max-width:560px;
    transform:translate(-50%,100%);background:var(--card);z-index:81;
    border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 32px -12px rgba(0,0,0,.4);
  }
  #trackSheet.on{transform:translate(-50%,0)}
  #trackSheet h2{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.02em}
  #trackSheet .sub{margin:0 0 14px;font-size:12px;color:var(--ink-35)}
  .tracktabs{display:flex;gap:6px;margin-bottom:14px}
  .tracktab{
    flex:1;appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:700;
    padding:9px 8px;border-radius:7px;border:1px solid var(--rule-2);background:#fff;color:var(--ink-35);
    transition:.15s;
  }
  .tracktab.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .trackfield{margin-bottom:10px}
  .trackfield label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-60);margin-bottom:5px}
  .trackfield select,.trackfield input{
    width:100%;box-sizing:border-box;font-family:var(--sans);font-size:13.5px;
    padding:11px 12px;border:1px solid var(--rule-2);border-radius:7px;outline:none;background:#fff;
  }
  .trackfield select:focus,.trackfield input:focus{border-color:var(--ink)}
  .trackhint{font-size:11px;color:var(--ink-35);line-height:1.5;margin:2px 0 14px}
  .tracksave{
    display:block;width:100%;text-align:center;appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;font-weight:700;color:#fff;
    padding:12px 13px;border:0;border-radius:7px;background:var(--ink);transition:.15s;
  }
  .tracksave:hover{opacity:.88}

  /* 행에 표시되는 송장 정보 + 알림 버튼 */
  .trackinfo{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-top:7px;padding:6px 9px;
    background:#eef4fb;border:1px solid #bcd8f2;border-radius:5px;
    font-size:11.5px;color:var(--stamp-blue);font-weight:600;
  }
  .trackinfo .tno{font-family:var(--mono);letter-spacing:.02em}
  .notifytrackbtn{
    margin-left:auto;flex:none;appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:4px;border:1px solid var(--stamp-blue);
    background:#fff;color:var(--stamp-blue);transition:.15s;
  }
  .notifytrackbtn:hover{background:var(--stamp-blue);color:#fff}
  .notifytrackbtn.sent{border-color:var(--rule-2);color:var(--ink-35);background:#fff;cursor:default}
  .reason{
    display:block;width:100%;text-align:left;
    appearance:none;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink);
    padding:12px 13px;margin-bottom:7px;
    border:1px solid var(--rule-2);border-radius:7px;background:#fff;
    transition:.15s;
  }
  .reason:hover{border-color:var(--stamp-amber);background:#f7fbff}
  .reason small{display:block;font-weight:500;font-size:11px;color:var(--ink-35);margin-top:2px}
  .cancel{
    width:100%;appearance:none;cursor:pointer;margin-top:5px;
    font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-35);
    padding:11px;border:0;background:none;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (min-width:640px){
    body{max-width:560px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh}
    .footbar{max-width:560px;left:50%;transform:translateX(-50%)}
  }
  :focus-visible{outline:2px solid var(--stamp-blue);outline-offset:2px}
  /* ===== 다크 모드 마감: 종이 기반 디자인의 흰 표면·검정(ink) 버튼을 다크 토큰으로 재도색 =====
     data-theme는 로드시 항상 설정되므로 [data-theme="dark"] 하나만 타깃해도 OS 다크까지 커버됩니다. */
  :root[data-theme="dark"] .dday{background:linear-gradient(180deg,#26262e,#202028)}
  :root[data-theme="dark"] .stockbox{background:#202028;border-color:var(--rule)}
  :root[data-theme="dark"] .stockbox.short{background:#3a2422;border-color:#5a2a2e}
  :root[data-theme="dark"] .stockbox.exact{background:#3a2e17;border-color:#5c4a1e}
  :root[data-theme="dark"] .calcrow{background:#1b1b22}
  :root[data-theme="dark"] .trap{background:#3a2422;border-color:#5a2a2e;color:#ef6d7f}
  :root[data-theme="dark"] .note{background:#1b2430}
  :root[data-theme="dark"] .trackinfo{background:#12233a;border-color:#1d3a5c}
  :root[data-theme="dark"] .qhold{background:#202028}
  :root[data-theme="dark"] .calcbtn{background:#202028}
  :root[data-theme="dark"] .check{background:#202028}
  :root[data-theme="dark"] .holdbtn{background:#202028}
  :root[data-theme="dark"] .status.st-wait{background:#202028}
  :root[data-theme="dark"] .status.st-prog{background:#12233a;color:#5cb4ee;border-color:#1d3a5c}
  :root[data-theme="dark"] .status.st-done{background:#12261b;color:#46c66a;border-color:#1e4a30}
  :root[data-theme="dark"] .status.st-hold{background:#3a2e17;color:#e7b75c;border-color:#5c4a1e}
  :root[data-theme="dark"] .holdbar{background:#3a2e17;border-color:#5c4a1e}
  :root[data-theme="dark"] .tracktab{background:#202028}
  :root[data-theme="dark"] .trackfield select,
  :root[data-theme="dark"] .trackfield input,
  :root[data-theme="dark"] #sheet input{background:#202028;color:var(--ink);border-color:var(--rule-2)}
  :root[data-theme="dark"] .notifytrackbtn,
  :root[data-theme="dark"] .notifytrackbtn.sent{background:#202028}
  :root[data-theme="dark"] .reason{background:#202028}
  :root[data-theme="dark"] .reason:hover{background:#1b2430}
  /* ink을 배경으로 쓰던 기본(Primary) 버튼 → 브랜드 블루로 */
  :root[data-theme="dark"] .send{background:#1577cc;border-color:#1577cc;color:#fff}
  :root[data-theme="dark"] .send:disabled{background:#202028;color:var(--ink-35);border-color:var(--rule)}
  :root[data-theme="dark"] .send.sent{background:#202028;color:#46c66a;border-color:#1e4a30}
  :root[data-theme="dark"] .subtab[aria-pressed="true"]{background:#1577cc;border-color:#1577cc;color:#fff}
  :root[data-theme="dark"] .tracktab.active{background:#1577cc;border-color:#1577cc;color:#fff}
  :root[data-theme="dark"] .tracksave{background:#1577cc;color:#fff}

  /* ===== 상품별 펼쳐보기(멀티 상품 주문) ===== */
  .prodtoggle{
    appearance:none;cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:700;
    color:var(--stamp-blue);background:var(--card);border:1px solid var(--rule-2);border-radius:6px;
    padding:5px 10px;margin:2px 0 4px;display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .prodtoggle:hover{border-color:var(--stamp-blue)}
  .prodtoggle .chev{transition:transform .15s;font-size:9px}
  .prodtoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .prodpanel{margin:2px 0 6px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);overflow:hidden}
  .prodhead{font-size:10.5px;color:var(--ink-35);padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--card)}
  .prodline{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;cursor:pointer;margin:0}
  .prodline:last-of-type{border-bottom:0}
  .prodline.is-short{background:#fce8ea}
  .prodline input{width:16px;height:16px;accent-color:var(--stamp-blue);flex:none;cursor:pointer}
  .prodline .pname{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prodline .popt{font-weight:500;color:var(--ink-35)}
  .prodline .pqty{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-60);flex:none}
  .prodline .pavail{font-family:var(--mono);font-size:11px;color:var(--ink-60);flex:none;min-width:58px;text-align:right}
  .pbadge{font-size:10px;font-weight:700;border-radius:3px;padding:2px 6px;flex:none}
  .pbadge.ok{color:var(--stamp-green);background:#e6f4ec}
  .pbadge.short{color:#fff;background:var(--stamp-red)}
  .pbadge.unk{color:var(--ink-35);background:var(--rule)}
  .pbadge.ls-hold{color:#fff;background:var(--stamp-amber)}
  .pbadge.ls-reject{color:#fff;background:var(--stamp-red)}
  .pbadge.ls-exch{color:#fff;background:var(--stamp-blue)}
  .prodline.has-status{background:var(--paper)}
  .pact.clear{color:var(--ink-60)}
  .prodactions{display:flex;gap:6px;padding:9px 10px;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--rule)}
  .prodactions .selhint{font-size:10.5px;color:var(--ink-35);margin-right:auto;align-self:center}
  .pact{appearance:none;cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:700;border-radius:6px;padding:6px 10px;border:1px solid var(--rule-2);background:var(--card);color:var(--ink-60);transition:.15s}
  .pact.hold{color:var(--stamp-amber);border-color:var(--stamp-amber)}
  .pact.reject{color:var(--stamp-red);border-color:var(--stamp-red)}
  .pact.exch{color:var(--stamp-blue);border-color:var(--stamp-blue)}
  .pact:hover{filter:brightness(.97)}
  :root[data-theme="dark"] .prodline.is-short{background:#3a2422}
  :root[data-theme="dark"] .pbadge.ok{background:#173327}
  :root[data-theme="dark"] .pbadge.unk{background:#3c3c46}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 class="title">출고요청 대장</h1>
    <span class="proto">PROTO</span>
    <span class="clock" id="clock"></span>
    <button id="themeToggle" title="라이트/다크 전환" aria-label="테마 전환" style="appearance:none;border:1px solid var(--rule-2);background:var(--card);color:var(--ink-60);border-radius:6px;width:30px;height:26px;cursor:pointer;font-size:13px;line-height:1;">◐</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="subtabs" id="subtabs"></div>
</header>

<main id="list"></main>

<div class="footbar">
  <div class="stat late"><span class="v" id="s-late">0</span><span class="k">지연</span></div>
  <div class="sep"></div>
  <div class="stat"><span class="v" id="s-wait">0</span><span class="k">미처리</span></div>
  <div class="sep"></div>
  <div class="stat hold"><span class="v" id="s-hold">0</span><span class="k">보류</span></div>
  <div class="sep"></div>
  <div class="stat done"><span class="v" id="s-done">0</span><span class="k">완료</span></div>
  <div class="src">MOCK DATA<br>연동 전 화면</div>
</div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <h2 id="sheet-h">보류 사유</h2>
  <p class="sub" id="sheet-sub"></p>
  <div id="reasons"></div>
  <button class="cancel" data-close>취소</button>
</div>

<div id="trackScrim"></div>
<div id="trackSheet" role="dialog" aria-modal="true" aria-labelledby="track-h">
  <h2 id="track-h">송장 등록</h2>
  <p class="sub" id="track-sub"></p>

  <div class="tracktabs">
    <button type="button" class="tracktab active" data-trackmode="manual">지금 바로 등록</button>
    <button type="button" class="tracktab" data-trackmode="seq">관리번호만 연결</button>
  </div>

  <div id="trackManual">
    <div class="trackfield">
      <label>택배사</label>
      <select id="trackCarrier">
        <option value="CJ대한통운">CJ대한통운</option>
        <option value="한진택배">한진택배</option>
        <option value="롯데택배">롯데택배</option>
        <option value="로젠택배">로젠택배</option>
        <option value="우체국택배">우체국택배</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="trackfield">
      <label>송장번호</label>
      <input id="trackNoInput" type="text" placeholder="예: 123456789012" inputmode="numeric">
    </div>
    <p class="trackhint">등록만 돼요 — 요청자에게 알림은 가지 않아요. 목록에서 "송장 알림 보내기" 버튼을 눌러야 전달돼요.</p>
    <button type="button" class="tracksave" id="trackManualSave">등록만 하기</button>
  </div>

  <div id="trackSeq" style="display:none">
    <div class="trackfield">
      <label>이지어드민 관리번호</label>
      <input id="trackSeqInput" type="text" placeholder="예: 20260805-000123">
    </div>
    <p class="trackhint">연결해두면 5분마다 자동으로 확인해서, 송장이 등록되는 즉시 채워져요. 이때도 알림은 자동으로 가지 않고, 목록에서 "송장 알림 보내기"를 직접 눌러야 전달돼요.</p>
    <button type="button" class="tracksave" id="trackSeqSave">관리번호 연결</button>
  </div>

  <button class="cancel" data-close-track>취소</button>
</div>

<div id="toast"></div>

<script>
const API_BASE = "https://logistics-backend-production-dabb.up.railway.app";
const TODAY = new Date();

// ── 실제 데이터 (서버 연동) ──
// 재고(phys/inv/pend)는 여기서 만들지 않고, 화면이 열릴 때 /api/stock 으로
// sku 기준 실시간 조회해서 채웁니다. pend(미처리)는 이지어드민이 별도로 안 주는
// 값이라 항상 0입니다 — 가용재고 = 현재고 − 접수/송장 으로 계산됩니다.
let DATA = [];
let STOCK = {};

async function loadStock(skus) {
  const list = [...new Set(skus.filter(Boolean))];
  if (!list.length) return;
  try {
    const res = await fetch(API_BASE + "/api/stock?codes=" + encodeURIComponent(list.join(",")));
    if (res.ok) STOCK = await res.json();
  } catch (e) { /* 재고 조회 실패는 화면을 막지 않음 — 0으로 남음 */ }
}

function applyStock() {
  DATA.forEach(r => {
    const s = STOCK[r.sku];
    r.phys = s ? s.stock : 0;
    r.inv = s && s.available != null ? (s.stock - s.available) : 0;
    r.pend = 0;
  });
}

// ── 로직: 출고 희망일 하나로 일/주/월 파생 ──
const d0 = d => {const x=new Date(d+'T00:00:00+09:00');x.setHours(0,0,0,0);return x;};
const t0 = (()=>{const x=new Date(TODAY);x.setHours(0,0,0,0);return x;})();
const dday = r => Math.round((d0(r.want)-t0)/864e5);
const bucket = r => {const d=dday(r); return d<=0?'day':(d<=7?'week':'month');};

let TAB='day', SCOPE='team';
let state = new Map();
function rebuildState() {
  state = new Map(DATA.map(r=>[r.sr,{status:r.status, checked:r.status==='완료', sent:r.sent, hold:r.hold||null}]));
}

// 보류 사유 — 물류팀이 통제 못 하는 원인만. 여기 없으면 그건 누락임.
const REASONS = [
  {k:'재고 부족',      d:'재고가 없어 출고 불가 · 입고 대기 중'},
  {k:'입고 지연',      d:'발주는 했으나 아직 안 들어옴'},
  {k:'요청 정보 부족', d:'품목·수량·수령처 확인 필요'},
  {k:'요청팀 확인 대기', d:'요청한 쪽에 되물었고 답 기다리는 중'},
  {k:'__etc__',        d:'위에 없는 사유 · 직접 입력'},
];

// 에스컬레이션: 희망일 +2일 경과 & '대기'. 보류는 정지.
const willEscalate = r => state.get(r.sr).status==='대기' && dday(r) <= -2;

const BUCKETS=[{k:'day',t:'일별'},{k:'week',t:'주간'},{k:'month',t:'월간'}];
const SCOPES=[{k:'team',t:'물류 통합'},{k:'person',t:'개인 요청'}];

function view(){return DATA.filter(r=>bucket(r)===TAB && r.scope===SCOPE);}

function renderTabs(){
  document.getElementById('tabs').innerHTML = BUCKETS.map(b=>{
    const rs=DATA.filter(r=>bucket(r)===b.k && r.scope===SCOPE);
    const open=rs.filter(r=>!['완료','보류'].includes(state.get(r.sr).status)).length;
    const late=rs.some(r=>dday(r)<0 && !['완료','보류'].includes(state.get(r.sr).status));
    return `<button class="tab${late?' has-late':''}" role="tab" aria-selected="${TAB===b.k}" data-tab="${b.k}">
      ${b.t}<span class="n">${open}</span></button>`;
  }).join('');
  document.getElementById('subtabs').innerHTML = SCOPES.map(s=>{
    const n=DATA.filter(r=>r.scope===s.k && !['완료','보류'].includes(state.get(r.sr).status)).length;
    return `<button class="subtab" aria-pressed="${SCOPE===s.k}" data-scope="${s.k}">
      ${s.t}<span class="c">${n}</span></button>`;
  }).join('');
}

const CHK=`<svg viewBox="0 0 24 24"><polyline points="4 12 9.5 17.5 20 6.5"/></svg>`;
const SND=`<svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>`;
const SLK=`<svg class="slack" viewBox="0 0 24 24" fill="#E01E5A"><path d="M6 15a2 2 0 1 1-2-2h2v2zm1 0a2 2 0 0 1 4 0v5a2 2 0 1 1-4 0v-5z"/><path fill="#36C5F0" d="M9 6a2 2 0 1 1 2 2H9V6zm0 1a2 2 0 0 1 0 4H4a2 2 0 1 1 0-4h5z"/><path fill="#2EB67D" d="M18 9a2 2 0 1 1 2 2h-2V9zm-1 0a2 2 0 0 1-4 0V4a2 2 0 1 1 4 0v5z"/><path fill="#ECB22E" d="M15 18a2 2 0 1 1-2-2h2v2zm0-1a2 2 0 0 1 0-4h5a2 2 0 1 1 0 4h-5z"/></svg>`;

function stockBox(r){
  const phys=r.phys, inv=r.inv, pend=r.pend, q=r.qty;
  const avail = phys - inv - pend;          // 가용재고 = 현재고 − 송장대기 − 미처리
  const short = avail < q;
  const exact = avail >= q && avail < q*1.2; // 여유 20% 미만이면 주의
  const held = state.get(r.sr).status==='보류';
  const done = state.get(r.sr).status==='완료';
  const cls = short?'short':(exact?'exact':'');
  const pct = q===0?0:Math.max(0,Math.min(100, Math.round(avail/q*100)));
  const tag = short
    ? `<span class="shorttag">부족 ${(q-avail).toLocaleString()}</span>`
    : (exact ? `<span class="shorttag exacttag">여유 ${(avail-q).toLocaleString()}</span>` : '');
  const quick = (short && !held && !done)
    ? `<button class="qhold" data-act="qhold">재고부족 보류</button>` : '';
  // 전산 현재고만 보면 충분한데 가용으로는 부족한 경우 → 경고 강조
  const trap = (phys >= q && avail < q);
  return `<div class="stockbox ${cls}" data-sr="${r.sr}">
    <span class="stk avail"><span class="lab">가용</span><span class="v">${avail.toLocaleString()}</span></span>
    <span class="stk req"><span class="lab">요청</span><span class="v">${q.toLocaleString()}</span></span>
    <span class="gauge"><i style="width:${pct}%"></i></span>
    ${tag}
    ${quick}
    <button class="calcbtn" data-act="calc" aria-label="가용재고 계산식 보기">﹖</button>
    <span class="stk sku">${r.sku}</span>
  </div>
  <div class="calcrow" id="calc-${r.sr}" hidden>
    ${trap?`<div class="trap">⚠ 전산 현재고(${phys.toLocaleString()})만 보면 충분하지만, 출고 예약분을 빼면 실제로는 부족해요.</div>`:''}
    <div class="calcline">
      <span class="ci"><b>${phys.toLocaleString()}</b><i>현재고</i></span>
      <span class="op">−</span>
      <span class="ci"><b>${inv.toLocaleString()}</b><i>송장 대기</i></span>
      <span class="op">−</span>
      <span class="ci"><b>${pend.toLocaleString()}</b><i>미처리 접수</i></span>
      <span class="op">=</span>
      <span class="ci res ${short?'r-short':''}"><b>${avail.toLocaleString()}</b><i>가용재고</i></span>
    </div>
    <div class="calcsrc">이지어드민 실시간 · SKU ${r.sku}</div>
  </div>`;
}

// 상품코드(SKU) 하나의 가용재고. 없으면 null(재고 미확인).
function prodAvail(code){
  const s = STOCK[String(code||'').trim()];
  if(!s) return null;
  return s.available != null ? s.available : s.stock;
}

// 체크된 상품 이름 목록 (해당 주문 패널 안에서만)
function tickedProdNames(sr){
  return [...document.querySelectorAll('.prodtick[data-sr="'+CSS.escape(sr)+'"]:checked')]
    .map(c=>c.dataset.name).filter(Boolean);
}

// 멀티 상품 주문의 펼침 패널 — 상품별 가용재고 충분/부족 + 개별 체크
function prodPanel(r, prods){
  const lines = prods.map((p,i)=>{
    const code=(p.code||'').trim();
    const av = code ? prodAvail(code) : null;
    const qty = Number(p.qty)||0;
    const known = av != null;
    const short = known && av < qty;
    const badge = !known ? `<span class="pbadge unk">재고 미확인</span>`
               : short ? `<span class="pbadge short">부족 ${(qty-av).toLocaleString()}</span>`
                       : `<span class="pbadge ok">충분</span>`;
    const ls = p.lineStatus;
    const lsBadge = ls ? `<span class="pbadge ls-${ls==='반려'?'reject':ls==='교환요청'?'exch':'hold'}" title="${escHtml(p.lineReason||'')}">${escHtml(ls)}</span>` : '';
    return `<label class="prodline${short?' is-short':''}${ls?' has-status':''}">
      <input type="checkbox" class="prodtick" data-sr="${r.sr}" data-idx="${i}" data-name="${escHtml(p.name||'')}">
      <span class="pname">${escHtml(p.name||'(상품명 없음)')}${p.option?` <span class="popt">${escHtml(p.option)}</span>`:''}</span>
      <span class="pqty">×${qty.toLocaleString()}</span>
      <span class="pavail">${known?`가용 ${av.toLocaleString()}`:'가용 —'}</span>
      ${lsBadge||badge}
    </label>`;
  }).join('');
  return `<div class="prodpanel" id="prods-${r.sr}" hidden>
    <div class="prodhead">상품 ${prods.length}개 — 재고가 부족한 상품을 체크한 뒤 아래에서 보류·반려·교환을 선택하세요. 상태는 상품별로 저장되고 요청자에게 통보돼요.</div>
    ${lines}
    <div class="prodactions">
      <span class="selhint">체크한 상품만 처리돼요</span>
      <button class="pact hold" data-act="prodhold">선택 상품 보류</button>
      <button class="pact reject" data-act="prodreject">재고부족 반려</button>
      <button class="pact exch" data-act="prodexchange">교환 요청</button>
      <button class="pact clear" data-act="prodclear">정상 복귀</button>
    </div>
  </div>`;
}

function row(r){
  const st=state.get(r.sr), d=dday(r);
  const done=st.status==='완료';
  const held=st.status==='보류';
  const late=d<0 && !done && !held;          // 보류는 지연으로 세지 않음
  const esc=willEscalate(r);
  const cls=['row', late?'late':'', done?'done':'', held?'hold':'',
             (d===0&&!done&&!held)?'today':''].filter(Boolean).join(' ');
  const num = d<0 ? `+${-d}` : (d===0?'0':`${d}`);
  const unit = held ? '정지' : (d<0 ? '일 지연' : (d===0?'오늘':'일 남음'));
  const stMap={'대기':['st-wait','대기'],'진행중':['st-prog','진행중'],
               '완료':['st-done','완료'],'보류':['st-hold','보류']};
  const [sc,sl]=stMap[st.status];

  return `<article class="${cls}" data-sr="${r.sr}">
    <div class="dday"><span class="num">${num}</span><span class="unit">${unit}</span></div>
    <div class="body">
      <div class="line1">
        <span class="sr">${r.sr}</span>
        <span class="team">${r.team}</span>
        <span class="who">${r.by}</span>
        ${r.assignee?`<span class="assignee">→ ${r.assignee}</span>`:''}
      </div>
      <div class="item">${r.item} <span class="opt">${r.opt!=='—'?r.opt:''}</span> <span class="qty">×${r.qty.toLocaleString()}</span>${(r.products&&r.products.length>1)?` <span class="opt">외 ${r.products.length-1}건</span>`:''}</div>
      ${stockBox(r)}
      ${(r.products&&r.products.length>1)?`<button class="prodtoggle" data-act="expandprods" aria-expanded="false">📋 상품 ${r.products.length}개 · 펼쳐보기 <span class="chev">▾</span></button>${prodPanel(r, r.products)}`:''}
      <div class="line3">
        <span class="meta">희망 <b>${r.want.slice(5).replace('-','/')}</b></span>
        <span class="meta">수령 <b>${r.to}</b></span>
        <span class="meta">접수 ${r.recv}</span>
      </div>
      ${r.note?`<div class="note">${r.note}</div>`:''}
      ${held?`<div class="holdbar"><span class="pz">알림 정지</span><span>${st.hold} · 요청자에게 통보됨</span></div>`:''}
      ${esc?`<div class="holdbar" style="background:#FBEDEC;border-color:#EFC5C1;color:var(--stamp-red)">
        <span class="pz" style="background:var(--stamp-red)">에스컬레이션</span>
        <span>2일 초과 — 팀장 보고 대상 (파일럿 중 발송 OFF)</span></div>`:''}
      ${r.trackingNo?`<div class="trackinfo">
        <span>🚚</span><span>${escHtml(r.carrier||'')}</span><span class="tno">${escHtml(r.trackingNo)}</span>
        <button type="button" class="notifytrackbtn${r.trackingNotified?' sent':''}" data-act="notifytrack">${r.trackingNotified?'알림 전송됨':'📨 송장 알림 보내기'}</button>
      </div>`:''}
      <div class="actions">
        <button class="status ${sc}" data-act="status" ${held?'disabled style="opacity:.55"':''}><span class="dot"></span>${sl}</button>
        <button class="check" data-act="check" aria-pressed="${st.checked}" aria-label="처리 완료 표시" ${held?'disabled style="opacity:.4"':''}>${CHK}</button>
        <button class="holdbtn" data-act="hold" aria-pressed="${held}">${held?'보류 해제':'보류'}</button>
        <button class="holdbtn" data-act="track">송장</button>
        <button class="send${st.sent?' sent':''}" data-act="send" ${(!done||st.sent)?'disabled':''}>
          ${SND}${st.sent?'전송됨':'완료 전송'}</button>
      </div>
    </div>
  </article>`;
}

function render(){
  renderTabs();
  const rs=view();
  const el=document.getElementById('list');

  if(!rs.length){
    el.innerHTML=`<div class="empty"><div class="mk">◻︎</div><p>이 구간에 요청이 없어요.</p></div>`;
  } else {
    const groups={};
    rs.sort((a,b)=>dday(a)-dday(b) || a.sr.localeCompare(b.sr));
    rs.forEach(r=>{(groups[r.want] ||= []).push(r);});
    el.innerHTML = Object.entries(groups).map(([w,g])=>{
      const d=dday(g[0]);
      const lbl = d<0?`지연 · ${w.slice(5).replace('-','/')} 희망`
                : d===0?`오늘 출고 · ${w.slice(5).replace('-','/')}`
                : `${w.slice(5).replace('-','/')} · D-${d}`;
      return `<section class="daygroup"><div class="daylabel">${lbl}</div>${g.map(row).join('')}</section>`;
    }).join('');
  }

  const all=DATA.filter(r=>r.scope===SCOPE);
  const s=sr=>state.get(sr).status;
  document.getElementById('s-late').textContent = all.filter(r=>dday(r)<0 && s(r.sr)!=='완료' && s(r.sr)!=='보류').length;
  document.getElementById('s-wait').textContent = all.filter(r=>s(r.sr)!=='완료' && s(r.sr)!=='보류').length;
  document.getElementById('s-hold').textContent = all.filter(r=>s(r.sr)==='보류').length;
  document.getElementById('s-done').textContent = all.filter(r=>s(r.sr)==='완료').length;
}

let tt;
function toast(html){
  const t=document.getElementById('toast');
  t.innerHTML=html; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600);
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){TAB=tab.dataset.tab; render(); return;}
  const sub=e.target.closest('[data-scope]');
  if(sub){SCOPE=sub.dataset.scope; render(); return;}

  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const sr=btn.closest('.row').dataset.sr;
  const st=state.get(sr);
  const r=DATA.find(x=>x.sr===sr);

  if(btn.dataset.act==='status'){
    const next = st.status==='대기'?'진행중':(st.status==='진행중'?'완료':'대기');
    patchStatus(sr, next);
    return;
  }
  if(btn.dataset.act==='check'){
    const next = st.checked?'진행중':'완료';
    patchStatus(sr, next);
    return;
  }
  if(btn.dataset.act==='send'){
    // 웹 접수 건은 Slack ID가 없어 알림이 안 가므로, 전송을 단정하지 않고 정직하게 안내합니다.
    toast(`${SLK}<span><b>${r.sr}</b> 완료 처리 · Slack으로 접수된 건만 요청자에게 자동 알림이 가요</span>`);
    patchNotify(sr);
    return;
  }
  if(btn.dataset.act==='hold'){
    if(st.status==='보류'){
      toast(`${SLK}<span><b>${r.sr}</b> 보류 해제 · 알림 재개</span>`);
      patchStatus(sr, '대기');
    } else {
      openSheet(sr);
    }
    return;
  }
  if(btn.dataset.act==='track'){
    openTrackSheet(sr);
    return;
  }
  if(btn.dataset.act==='notifytrack'){
    if(btn.classList.contains('sent')) return;
    notifyTracking(sr);
    return;
  }
  if(btn.dataset.act==='qhold'){
    applyHold(sr, '재고 부족');
  }
  if(btn.dataset.act==='expandprods'){
    const panel=document.getElementById('prods-'+sr);
    if(panel){ const show=panel.hidden; panel.hidden=!show; btn.setAttribute('aria-expanded', String(show)); }
    return;
  }
  if(['prodhold','prodreject','prodexchange','prodclear'].includes(btn.dataset.act)){
    const ticks=[...document.querySelectorAll('.prodtick[data-sr="'+CSS.escape(sr)+'"]:checked')];
    if(!ticks.length){ alert('먼저 처리할 상품을 체크해 주세요. (예: 재고가 부족한 상품)'); return; }
    const indexes=ticks.map(c=>Number(c.dataset.idx));
    const names=ticks.map(c=>c.dataset.name).filter(Boolean);
    const action = btn.dataset.act==='prodexchange' ? 'exchange'
                 : btn.dataset.act==='prodreject' ? 'reject'
                 : btn.dataset.act==='prodclear' ? 'clear' : 'hold';
    const label = action==='exchange'?'교환 요청':action==='reject'?'재고부족 반려':action==='clear'?'정상 복귀':'보류';
    const reason = action==='clear' ? '' : `${label}: ${names.join(', ')}`;
    patchProductStatus(sr, action, indexes, reason, label);
    return;
  }
  if(btn.dataset.act==='calc'){
    const box=document.getElementById('calc-'+sr);
    if(box) box.hidden=!box.hidden;
  }
});

async function patchStatus(sr, status){
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/status", {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({status})
    });
    if(!res.ok) throw new Error("서버 응답 "+res.status);
  }catch(e){ alert(sr+" 상태 변경에 실패했어요: "+(e.message||"연결 오류")); }
  await loadData();
}

async function patchHold(sr, reason){
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/hold", {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({reason})
    });
    if(!res.ok) throw new Error("서버 응답 "+res.status);
  }catch(e){ alert(sr+" 보류 처리에 실패했어요: "+(e.message||"연결 오류")); }
  await loadData();
}

// 주문 안 특정 상품(들)만 보류/반려/교환/정상복귀 — 상품별 상태를 서버에 저장하고 요청자에게 통보
async function patchProductStatus(sr, action, indexes, reason, label){
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/products/status", {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action, reason, indexes})
    });
    if(!res.ok) throw new Error("서버 응답 "+res.status);
    toast(`${SLK}<span><b>${sr}</b> · 선택 상품 ${label}${action!=='clear'?' · 요청자에게 통보':''}</span>`);
  }catch(e){ alert(sr+" 상품 상태 변경에 실패했어요: "+(e.message||"연결 오류")); }
  await loadData();
}

async function patchNotify(sr){
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/notify", {method:"POST"});
    if(!res.ok) throw new Error("서버 응답 "+res.status);
  }catch(e){ alert(sr+" 알림 전송에 실패했어요: "+(e.message||"연결 오류")); }
  await loadData();
}

// ── 송장 등록 시트 (등록과 알림을 분리) ──
let trackPending=null;
function openTrackSheet(sr){
  const r = DATA.find(x=>x.sr===sr);
  if (r && r.trackingNo) { alert(sr+"은 이미 송장이 등록되어 있어요: "+r.trackingNo+"\n(요청자 알림은 목록의 '송장 알림 보내기' 버튼으로 보내세요)"); return; }
  if (r && r.ezadminSeq) { alert(sr+"은 이지어드민 관리번호("+r.ezadminSeq+")가 이미 연결되어 있어요. 송장이 등록되면 자동으로 채워져요."); return; }

  trackPending = sr;
  document.getElementById('track-sub').innerHTML = `<b>${sr}</b> · ${escHtml(r.item)} — 등록만 하면 알림은 가지 않아요.`;
  document.getElementById('trackCarrier').value = 'CJ대한통운';
  document.getElementById('trackNoInput').value = '';
  document.getElementById('trackSeqInput').value = '';
  setTrackMode('manual');
  document.getElementById('trackScrim').classList.add('on');
  document.getElementById('trackSheet').classList.add('on');
  setTimeout(()=>document.getElementById('trackNoInput').focus(), 50);
}
function closeTrackSheet(){
  trackPending = null;
  document.getElementById('trackScrim').classList.remove('on');
  document.getElementById('trackSheet').classList.remove('on');
}
function setTrackMode(mode){
  document.querySelectorAll('.tracktab').forEach(b => b.classList.toggle('active', b.dataset.trackmode===mode));
  document.getElementById('trackManual').style.display = mode==='manual' ? '' : 'none';
  document.getElementById('trackSeq').style.display = mode==='seq' ? '' : 'none';
}
async function saveTrackManual(){
  const sr = trackPending; if(!sr) return;
  const carrier = document.getElementById('trackCarrier').value;
  const trackingNo = document.getElementById('trackNoInput').value.trim();
  if(!trackingNo){ document.getElementById('trackNoInput').focus(); return; }
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/tracking", {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({carrier, trackingNo})
    });
    if(!res.ok) throw new Error("서버 응답 "+res.status);
    closeTrackSheet();
    toast(`<span>${sr} 송장 등록 완료 · 알림은 아직 안 감</span>`);
    await loadData();
  }catch(e){ alert(sr+" 등록에 실패했어요: "+(e.message||"연결 오류")); }
}
async function saveTrackSeq(){
  const sr = trackPending; if(!sr) return;
  const seq = document.getElementById('trackSeqInput').value.trim();
  if(!seq){ document.getElementById('trackSeqInput').focus(); return; }
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/link-order", {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({seq})
    });
    if(!res.ok) throw new Error("서버 응답 "+res.status);
    closeTrackSheet();
    toast(`<span>${sr} 관리번호 연결 완료 · 자동 확인 시작 (알림은 아직 안 감)</span>`);
    await loadData();
  }catch(e){ alert(sr+" 연결에 실패했어요: "+(e.message||"연결 오류")); }
}
async function notifyTracking(sr){
  try{
    const res = await fetch(API_BASE+"/api/requests/"+encodeURIComponent(sr)+"/notify-tracking", {method:"POST"});
    if(!res.ok) throw new Error("서버 응답 "+res.status);
    const r = DATA.find(x=>x.sr===sr);
    toast(`${SLK}<span><b>${r?r.by:''}</b>님께 송장 알림 전송 · ${sr}</span>`);
    await loadData();
  }catch(e){ alert(sr+" 알림 전송에 실패했어요: "+(e.message||"연결 오류")); }
}

function applyHold(sr, reason){
  const r=DATA.find(x=>x.sr===sr);
  toast(`${SLK}<span><b>${r.by}</b>님께 통보 · ${reason}</span>`);
  patchHold(sr, reason);
}

// ── 보류 사유 시트 ──
let pending=null;
function openSheet(sr){
  pending=sr;
  const r=DATA.find(x=>x.sr===sr);
  document.getElementById('sheet-sub').innerHTML=`<b>${r.sr}</b> · ${r.item} — 사유를 고르면 리마인드와 에스컬레이션이 멈추고, 요청자에게 자동 통보돼요.`;
  document.getElementById('reasons').innerHTML=REASONS.map(x=>
    x.k==='__etc__'
      ? `<button class="reason" data-reason="__etc__">기타 (직접 입력)<small>${x.d}</small></button>`
      : `<button class="reason" data-reason="${x.k}">${x.k}<small>${x.d}</small></button>`
  ).join('') + `
    <div id="etcwrap" style="display:none;margin-top:2px">
      <input id="etcinput" type="text" maxlength="60" placeholder="예: 요청팀이 주소 오기재 — 재확인 요청함"
        style="width:100%;font-family:var(--sans);font-size:13px;padding:11px 12px;
        border:1px solid var(--stamp-amber);border-radius:7px;outline:none;box-sizing:border-box">
      <button class="reason" id="etcsave" style="margin-top:7px;text-align:center;border-color:var(--stamp-amber);
        color:var(--stamp-amber);font-weight:700">이 사유로 보류</button>
    </div>`;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  pending=null;
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]') || e.target.id==='scrim'){closeSheet();return;}

  // 기타 직접 입력 저장
  if(e.target.id==='etcsave' && pending){
    const val=(document.getElementById('etcinput').value||'').trim();
    if(!val){document.getElementById('etcinput').focus();return;}
    const sr=pending; closeSheet(); applyHold(sr, val);
    return;
  }

  const rb=e.target.closest('[data-reason]');
  if(rb && pending){
    if(rb.dataset.reason==='__etc__'){
      // 사유 목록 접고 입력창 노출
      document.querySelectorAll('#reasons > .reason').forEach(b=>{
        if(b.dataset.reason!=='__etc__') b.style.display='none';
      });
      rb.style.display='none';
      const w=document.getElementById('etcwrap');
      w.style.display='block';
      document.getElementById('etcinput').focus();
      return;
    }
    const sr=pending; closeSheet(); applyHold(sr, rb.dataset.reason);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='etcinput'){
    document.getElementById('etcsave').click();
  }
});

// ── 송장 등록 시트 이벤트 ──
document.addEventListener('click', e=>{
  if(e.target.closest('[data-close-track]') || e.target.id==='trackScrim'){ closeTrackSheet(); return; }

});

});

}

      <div style="margin-top:8px;text-align:right;">
        <button type="button" class="alertAckBtn" data-id="${escHtml(a.requestId)}"
          style="border:1px solid #ccc;border-radius:6px;padding:4px 10px;font-size:12px;background:#fafafa;cursor:pointer;">확인</button>
      </div>
    </div>`;
  }).join('');

  panel.querySelectorAll('.alertAckBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try{ await fetch(API_BASE+"/api/requests/"+encodeURIComponent(btn.dataset.id)+"/alerts/ack", {method:"POST"}); }catch(e){}
      pollAlerts();
    });
  });
}

async function loadData(){
  try{
    const res = await fetch(API_BASE + "/api/requests/logistics-view");
    if(!res.ok) throw new Error("서버 응답 " + res.status);
    const rows = await res.json();
    DATA = rows.map(r => ({
      sr:r.sr, sku:r.sku||'', phys:0, inv:0, pend:0,
      recv:r.recv, team:r.team, by:r.by, item:r.item, opt:r.opt||'—',
      qty:r.qty, want:r.want, to:r.to, note:r.note||'',
      status:r.status, hold:r.hold||null, scope:r.scope||'team',
      assignee:r.assignee||null, sent:!!r.sent,
      carrier:r.carrier||null, trackingNo:r.trackingNo||null, trackingNotified:!!r.trackingNotified, ezadminSeq:r.ezadminSeq||null,
      products:[],
    }));

    // 주문별 '전체 상품' 목록 — logistics-view엔 대표상품만 있어서,
    // 요청서 대장(ledger)에서 productsJson을 가져와 붙입니다. (배포 없이 상품 펼쳐보기 지원)
    try {
      const lr = await fetch(API_BASE + "/api/requests/ledger");
      if (lr.ok) {
        const ledger = await lr.json();
        const byId = {};
        ledger.forEach(v => {
          let ps = [];
          try { const j = JSON.parse(v.productsJson || "[]"); if (Array.isArray(j)) ps = j; } catch (e) {}
          byId[v.requestId] = ps;
        });
        DATA.forEach(r => { r.products = byId[r.sr] || []; });
      }
    } catch (e) { /* 상품 목록 조회 실패해도 대표상품 화면은 정상 동작 */ }

    // 대표 SKU + 모든 상품 코드의 재고를 한 번에 조회
    const allCodes = [];
    DATA.forEach(r => {
      if (r.sku) allCodes.push(r.sku);
      (r.products || []).forEach(p => { if (p && p.code) allCodes.push(String(p.code).trim()); });
    });
    await loadStock(allCodes);
    applyStock();
    rebuildState();
    render();
    pollAlerts();
  }catch(e){
    document.getElementById('list').innerHTML =
      `<div class="empty"><div class="mk">⚠</div><p>서버에 연결하지 못했어요.<br>잠시 후 자동으로 다시 시도할게요.</p></div>`;
  }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
